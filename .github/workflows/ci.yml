name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint, type check, test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: CLI smoke test
        run: |
          uv run resumable run examples/tasks.py:word_stats --input examples/items.csv --state smoke.db --json
          uv run resumable status --state smoke.db --json
