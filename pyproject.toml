[project]
name = "resumable-runner"
version = "0.1.0"
description = "Run a Python function over many items. Stop any time, rerun to resume."
readme = "README.md"
license = "MIT"
authors = [{ name = "Hyunjin Hwang" }]
requires-python = ">=3.11"
dependencies = []  # standard library only
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    "Environment :: Console",
]

[project.scripts]
resumable = "resumable.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resumable"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=resumable --cov-report=term-missing"
